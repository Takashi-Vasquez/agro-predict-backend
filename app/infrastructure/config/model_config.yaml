model:
  name: "prediccion-rendimiento"
  algorithms:
    - "random_forest"
    - "linear_regression"
  promotion_metric: "rmse"          # rmse | mae | r2
  promotion_tolerance: 0.01         # mejora mínima relativa (1%) para considerar ganador
  random_seed: 42

training:
  test_window_months: 6             # últimos 6 meses como test
  min_train_records: 50
  temporal_split_column: "created_at"

artifacts:
  base_path: "app/infrastructure/ml/artifacts/modelos"
  include_version_in_path: true